<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muly ❤️ Olcay</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fff0f3 0%, #ffe3e8 100%);
            --text-color: #4a252a;
            --card-bg: rgba(255, 255, 255, 0.9);
            --box-bg: #fff5f7;
            --accent-color: #ff4d6d;
            --accent-hover: #e01e45;
            --shadow: 0 12px 35px rgba(255, 77, 109, 0.15);
            --border-color: #ffccd5;
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0b0d14 0%, #171524 100%);
            --text-color: #f0f3f8;
            --card-bg: rgba(24, 27, 38, 0.92);
            --box-bg: #1f2333;
            --accent-color: #ff6b8b;
            --accent-hover: #ff85a1;
            --shadow: 0 12px 35px rgba(0, 0, 0, 0.6);
            --border-color: #2f354a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            transition: background 0.35s ease, color 0.35s ease, border-color 0.35s ease;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 15px 50px 15px;
            overflow-x: hidden;
            position: relative;
        }

        /* Üst Bar ve Tema Butonu */
        .top-bar {
            width: 100%;
            max-width: 560px;
            display: flex;
            justify-content: flex-end;
            margin-bottom: 15px;
            z-index: 10;
        }

        .theme-toggle {
            background: var(--card-bg);
            border: 1.5px solid var(--border-color);
            color: var(--text-color);
            padding: 8px 16px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle:hover {
            border-color: var(--accent-color);
            transform: translateY(-1px);
        }

        .container {
            max-width: 560px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 5;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1.5px solid var(--border-color);
            border-radius: 24px;
            padding: 25px;
            box-shadow: var(--shadow);
            text-align: center;
        }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 4rem;
            color: var(--accent-color);
            line-height: 1.1;
            margin-bottom: 8px;
        }

        /* Özel Romantik Söz Kutusu */
        .special-quote {
            background: var(--box-bg);
            border: 1px dashed var(--accent-color);
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--accent-color);
            margin: 10px 0 18px 0;
            letter-spacing: 0.3px;
        }

        .counter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .time-box {
            background: var(--box-bg);
            padding: 12px 6px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
        }

        .time-box span {
            display: block;
            font-size: 1.45rem;
            font-weight: 600;
            color: var(--accent-color);
        }

        .time-box label {
            font-size: 0.72rem;
            opacity: 0.85;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .anniversary-banner {
            background: var(--box-bg);
            padding: 12px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            margin-top: 16px;
            font-size: 0.88rem;
        }

        /* Sekmeli Kullanışlı Pano */
        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background: var(--box-bg);
            color: var(--text-color);
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .tab-btn.active {
            background: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .tab-content {
            display: none;
            text-align: left;
        }

        .tab-content.active {
            display: block;
        }

        input[type="text"], textarea {
            width: 100%;
            background: var(--box-bg);
            border: 1.5px solid var(--border-color);
            color: var(--text-color);
            padding: 12px 14px;
            border-radius: 12px;
            font-family: 'Poppins', sans-serif;
            margin-top: 10px;
            outline: none;
            font-size: 0.9rem;
        }

        input[type="text"]:focus, textarea:focus {
            border-color: var(--accent-color);
        }

        textarea {
            height: 90px;
            resize: none;
        }

        button.primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 500;
            margin-top: 12px;
            width: 100%;
            font-size: 0.95rem;
        }

        button.primary-btn:hover {
            background-color: var(--accent-hover);
        }

        .item-list {
            margin-top: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 260px;
            overflow-y: auto;
        }

        .list-card {
            background: var(--box-bg);
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            font-size: 0.9rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .list-card-text {
            flex: 1;
            word-break: break-word;
        }

        .list-card strong {
            color: var(--accent-color);
            display: block;
            font-size: 0.85rem;
            margin-bottom: 3px;
        }

        .todo-done {
            text-decoration: line-through;
            opacity: 0.55;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .mini-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        .mini-btn:hover {
            border-color: var(--accent-color);
            color: var(--accent-color);
        }

        /* Arka Plan Uçuşan Kalpler */
        .heart-bg {
            position: fixed;
            bottom: -20px;
            font-size: 18px;
            color: var(--accent-color);
            opacity: 0.25;
            pointer-events: none;
            animation: floatUp 8s linear infinite;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.8); opacity: 0.3; }
            100% { transform: translateY(-105vh) scale(1.3); opacity: 0; }
        }
    </style>
</head>
<body data-theme="light">

    <div class="top-bar">
        <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">🌙 Gece Modu</button>
    </div>

    <div class="container">
        <!-- Başlık, Özel Yazı ve Sayaç Kartı -->
        <div class="card">
            <h1>Muly & Olcay</h1>
            
            <!-- İstediğin Özel Yazı -->
            <div class="special-quote">
                ✨ "Parlaklığınla gecemi aydınlattın Muly..." ✨
            </div>

            <div class="counter-grid">
                <div class="time-box"><span id="days">0</span><label>Gün</label></div>
                <div class="time-box"><span id="hours">0</span><label>Saat</label></div>
                <div class="time-box"><span id="minutes">0</span><label>Dakika</label></div>
                <div class="time-box"><span id="seconds">0</span><label>Saniye</label></div>
            </div>
            
            <div class="anniversary-banner" id="anniversaryCountdown">
                Yıldönümümüze kalan süre hesaplanıyor... ✨
            </div>
        </div>

        <!-- Kullanışlı Sekmeli Pano Kartı -->
        <div class="card">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('letters', this)">💌 Mektup & Notlar</button>
                <button class="tab-btn" onclick="switchTab('todos', this)">✅ Yapılacaklar Listesi</button>
            </div>

            <!-- 1. Sekme: Mektuplar -->
            <div id="letters" class="tab-content active">
                <input type="text" id="senderName" placeholder="Kim yazıyor? (Muly veya Olcay)">
                <textarea id="noteInput" placeholder="İçinden geçen güzel sözleri veya mektubunu buraya yaz..."></textarea>
                <button class="primary-btn" onclick="addMessage()">Mektubu Bırak ❤️</button>
                <div class="item-list" id="messageList"></div>
            </div>

            <!-- 2. Sekme: Yapılacaklar Listesi -->
            <div id="todos" class="tab-content">
                <input type="text" id="todoInput" placeholder="Birlikte yapacağımız bir hayal veya plan yaz...">
                <button class="primary-btn" onclick="addTodo()">Listeye Ekle ✨</button>
                <div class="item-list" id="todoList"></div>
            </div>
        </div>
    </div>

    <script>
        const startDate = new Date("2026-03-14T00:08:00");

        // Sayaçları Güncelle
        function updateCounters() {
            const now = new Date();
            const diff = now - startDate;

            if (diff > 0) {
                document.getElementById("days").innerText = Math.floor(diff / (1000 * 60 * 60 * 24));
                document.getElementById("hours").innerText = Math.floor((diff / (1000 * 60 * 60)) % 24);
                document.getElementById("minutes").innerText = Math.floor((diff / 1000 / 60) % 60);
                document.getElementById("seconds").innerText = Math.floor((diff / 1000) % 60);
            }

            const currentYear = now.getFullYear();
            let nextAnniversary = new Date(currentYear, 2, 14, 0, 8, 0);
            if (now > nextAnniversary) {
                nextAnniversary = new Date(currentYear + 1, 2, 14, 0, 8, 0);
            }

            const annivDiff = nextAnniversary - now;
            const annivDays = Math.floor(annivDiff / (1000 * 60 * 60 * 24));
            const annivHours = Math.floor((annivDiff / (1000 * 60 * 60)) % 24);
            const annivMins = Math.floor((annivDiff / 1000 / 60) % 60);

            document.getElementById("anniversaryCountdown").innerHTML = 
                `🎉 Yıldönümümüze: <b>${annivDays} gün ${annivHours} saat ${annivMins} dakika</b> kaldı!`;
        }
        setInterval(updateCounters, 1000);
        updateCounters();

        // Tema Değiştirme (Sorunsuz Çalışan Yapı)
        function applyTheme(theme) {
            document.documentElement.setAttribute("data-theme", theme);
            document.body.setAttribute("data-theme", theme);
            const btn = document.getElementById("themeBtn");
            btn.innerHTML = theme === "dark" ? "☀️ Gündüz Modu" : "🌙 Gece Modu";
            localStorage.setItem("siteTheme", theme);
        }

        function toggleTheme() {
            const current = document.body.getAttribute("data-theme");
            applyTheme(current === "light" ? "dark" : "light");
        }

        // Sekme Geçişi
        function switchTab(tabId, btnElement) {
            document.querySelectorAll(".tab-content").forEach(el => el.classList.remove("active"));
            document.querySelectorAll(".tab-btn").forEach(btn => btn.classList.remove("active"));
            document.getElementById(tabId).classList.add("active");
            btnElement.classList.add("active");
        }

        // Mektup Sistemi
        function loadMessages() {
            const messages = JSON.parse(localStorage.getItem("mulyOlcayLetters")) || [];
            const list = document.getElementById("messageList");
            list.innerHTML = "";

            if (messages.length === 0) {
                list.innerHTML = '<p style="text-align:center; opacity:0.6; font-size:0.85rem; padding:10px;">Henüz mektup yok. İlk notu sen bırak! ❤️</p>';
                return;
            }

            messages.forEach((msg, index) => {
                const div = document.createElement("div");
                div.className = "list-card";
                div.innerHTML = `
                    <div class="list-card-text">
                        <strong>${msg.name}</strong>
                        <span>${msg.text}</span>
                    </div>
                    <button class="mini-btn" onclick="deleteMessage(${index})" title="Sil">🗑️</button>
                `;
                list.appendChild(div);
            });
        }

        function addMessage() {
            const name = document.getElementById("senderName").value.trim();
            const text = document.getElementById("noteInput").value.trim();
            if (!name || !text) {
                alert("Adını ve mesajını yazmayı unutma knk! 😊");
                return;
            }
            const messages = JSON.parse(localStorage.getItem("mulyOlcayLetters")) || [];
            messages.unshift({ name, text });
            localStorage.setItem("mulyOlcayLetters", JSON.stringify(messages));
            document.getElementById("noteInput").value = "";
            loadMessages();
        }

        function deleteMessage(index) {
            const messages = JSON.parse(localStorage.getItem("mulyOlcayLetters")) || [];
            messages.splice(index, 1);
            localStorage.setItem("mulyOlcayLetters", JSON.stringify(messages));
            loadMessages();
        }

        // Yapılacaklar Listesi Sistemi
        function loadTodos() {
            const todos = JSON.parse(localStorage.getItem("mulyOlcayTodos")) || [];
            const list = document.getElementById("todoList");
            list.innerHTML = "";

            if (todos.length === 0) {
                list.innerHTML = '<p style="text-align:center; opacity:0.6; font-size:0.85rem; padding:10px;">Henüz bir plan eklenmedi. Hayallerinizi yazın! ✨</p>';
                return;
            }

            todos.forEach((item, index) => {
                const div = document.createElement("div");
                div.className = "list-card";
                div.innerHTML = `
                    <div class="list-card-text ${item.done ? 'todo-done' : ''}" onclick="toggleTodo(${index})" style="cursor:pointer;">
                        ${item.done ? '💖' : '🤍'} ${item.text}
                    </div>
                    <div class="action-btns">
                        <button class="mini-btn" onclick="toggleTodo(${index})">✓</button>
                        <button class="mini-btn" onclick="deleteTodo(${index})">🗑️</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function addTodo() {
            const text = document.getElementById("todoInput").value.trim();
            if (!text) return;
            const todos = JSON.parse(localStorage.getItem("mulyOlcayTodos")) || [];
            todos.unshift({ text, done: false });
            localStorage.setItem("mulyOlcayTodos", JSON.stringify(todos));
            document.getElementById("todoInput").value = "";
            loadTodos();
        }

        function toggleTodo(index) {
            const todos = JSON.parse(localStorage.getItem("mulyOlcayTodos")) || [];
            todos[index].done = !todos[index].done;
            localStorage.setItem("mulyOlcayTodos", JSON.stringify(todos));
            loadTodos();
        }

        function deleteTodo(index) {
            const todos = JSON.parse(localStorage.getItem("mulyOlcayTodos")) || [];
            todos.splice(index, 1);
            localStorage.setItem("mulyOlcayTodos", JSON.stringify(todos));
            loadTodos();
        }

        // Uçuşan Kalpler Efekti
        function createHeart() {
            const heart = document.createElement("div");
            heart.className = "heart-bg";
            heart.innerText = "❤️";
            heart.style.left = Math.random() * 100 + "vw";
            heart.style.animationDuration = (Math.random() * 4 + 6) + "s";
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 9000);
        }
        setInterval(createHeart, 1200);

        // Sayfa Açılışında Yükle
        window.addEventListener("DOMContentLoaded", () => {
            const savedTheme = localStorage.getItem("siteTheme") || "light";
            applyTheme(savedTheme);
            loadMessages();
            loadTodos();
        });
    </script>
</body>
</html>
