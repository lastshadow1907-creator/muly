name: Muly Android APK
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  validate-web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript
        run: |
          node -e "const h=require('fs').readFileSync('index.html','utf8');for(const m of h.matchAll(/<script(?: [^>]*)?>([\\s\\S]*?)<\\/script>/g)){if(m[1].trim())new Function(m[1]);}console.log('JavaScript OK')"
  build:
    runs-on: ubuntu-latest
    needs: validate-web
    permissions:
      contents: read
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Muly
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Muly-2.0-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
