<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bizim Hikayemiz | Anı &amp; Zaman Sayacı</title>
    
    <!-- Google Fonts: Romantik Serif (Cormorant Garamond), El Yazısı (Caveat) ve Modern Sans (Plus Jakarta Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Tailwind Config & Custom Scripts -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                        serif: ['"Cormorant Garamond"', 'serif'],
                        handwriting: ['"Caveat"', 'cursive']
                    },
                    colors: {
                        roseGold: {
                            50: '#fdf8f6',
                            100: '#fbe8e3',
                            200: '#f5d5cc',
                            500: '#e07a5f',
                            600: '#c45d42',
                            800: '#9e4630'
                        }
                    }
                }
            }
        };

        let isPlayingMusic = false;
        // Buraya indirdiğin MP3 dosyasının adını yazabilirsin (Örn: 'muzik.mp3')
        const backgroundAudio = new Audio('muzik.mp3');
        backgroundAudio.loop = true;

        function toggleBackgroundMusic() {
            isPlayingMusic = !isPlayingMusic;
            const ring = document.getElementById('music-pulse-ring');
            const icon = document.getElementById('music-icon');
            
            if(isPlayingMusic) {
                backgroundAudio.play().catch(e => console.log("Otomatik oynatma engellendi:", e));
                if(ring) ring.classList.remove('opacity-0');
                if(icon) icon.setAttribute('data-lucide', 'volume-2');
            } else {
                backgroundAudio.pause();
                if(ring) ring.classList.add('opacity-0');
                if(icon) icon.setAttribute('data-lucide', 'music');
            }
            if(typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        }

        window.onload = function() {
            // Initial load scripts
            if(typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        };
    </script>
</head>
